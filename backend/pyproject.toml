[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "aporisa-backend"
version = "0.0.0"
description = "Local, stateless-semantics inference backend implementing the Aporisa protocol"
requires-python = ">=3.12,<3.13"
dependencies = [
  "mlx==0.32.3",
  # Pinned to the v0.7.4 tag commit: includes qwen4_exp (Qwen3.8-Flash-Next),
  # external PLE storage, FP8 conversion and the MTP drafter.
  "mlx-vlm @ git+https://github.com/Blaizzy/mlx-vlm.git@00093678a1f6bd513212d94778ffc381d6d731bf",
  "starlette==1.7.0",
  "uvicorn==0.54.0",
  "websockets==17.1",
  "jsonschema==4.26.0",
  "python-dotenv==1.2.3",
  "psutil==7.2.2",
]

[dependency-groups]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "httpx==0.28.1", "ruff==0.16.9"]

[project.scripts]
aporisa-backend = "aporisa_backend.lifecycle.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/aporisa_backend"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
